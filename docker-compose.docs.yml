# Documentazione locale: docker compose -f docker-compose.docs.yml up
# Sito su http://localhost:7800, hot-reload dei sorgenti in docs/
services:
  docs:
    image: zensical/zensical:latest
    container_name: service-app-docs
    working_dir: /docs
    volumes:
      - .:/docs
    ports:
      - "7800:7800"
    command: serve --dev-addr 0.0.0.0:7800