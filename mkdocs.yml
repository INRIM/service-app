site_name: service-app docs
site_description: Documentazione pubblica di service-app (ozon-env-app + ozon-formio) — backend RAD multi-tenant con form Form.io, CRUD su MongoDB e autenticazione Keycloak.
site_url: https://inrim.github.io/service-app/
repo_url: https://github.com/INRIM/service-app
repo_name: INRIM/service-app
copyright: INRIM — MIT License

theme:
  name: material
  language: it
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share
  palette:
    # Palette defaults to light; dark mode follows the reader toggle.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Passa al tema chiaro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Passa al tema scuro
  icon:
    logo: material/form-select
  favicon: assets/images/favicon.png

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Home: Home
            Iniziare: Getting started
            Architettura: Architecture
            Percorso guidato: Guided path
            Guide: Guides
            Demo: Demo
            Riferimenti: Reference

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Iniziare: getting-started.md
  - Architettura: architecture.md
  - Percorso guidato:
      - wizard/index.md
      - wizard/step-1-create-form.md
      - wizard/step-2-components.md
      - wizard/step-3-actions.md
      - wizard/step-4-external-services.md
      - wizard/step-5-workers-camunda.md
  - Guide:
      - guides/acl.md
      - guides/keycloak-auth.md
      - guides/query-field-acl.md
      - guides/import-ownership.md
      - guides/remote-select.md
      - guides/security.md
  - Demo:
      - demo/index.md
      - demo/examples.md
  - Riferimenti:
      - reference/action-router.md
      - reference/endpoints.md