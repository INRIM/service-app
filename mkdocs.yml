site_name: service-app docs
site_description: Documentazione pubblica di service-app (ozon-env-app + ozon-formio) — backend RAD multi-tenant con form Form.io, CRUD su MongoDB e autenticazione Keycloak.
site_url: https://inrim.github.io/service-app/
repo_url: https://github.com/INRIM/service-app
repo_name: INRIM/service-app
copyright: INRIM — MIT License

theme:
  name: material
  language: it
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share
  palette:
    # Palette defaults to light; dark mode follows the reader toggle.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Passa al tema chiaro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Passa al tema scuro
  logo: assets/images/inrim-logo.svg
  favicon: assets/images/favicon.png

extra_javascript:
  - javascripts/lang-switch.js

extra:
  alternate:
    - name: Italiano
      link: /service-app/
      lang: it
    - name: English
      link: /service-app/en/
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Iniziare / Getting started: getting-started.md
  - Architettura / Architecture: architecture.md
  - Percorso guidato / Guided path:
      - wizard/index.md
      - wizard/step-1-create-form.md
      - wizard/step-2-components.md
      - wizard/step-3-actions.md
      - wizard/step-4-external-services.md
      - wizard/step-5-workers-camunda.md
  - Guide:
      - guides/acl.md
      - guides/keycloak-auth.md
      - guides/query-field-acl.md
      - guides/import-ownership.md
      - guides/remote-select.md
      - guides/security.md
  - Demo:
      - demo/index.md
      - demo/examples.md
  - Riferimenti / Reference:
      - reference/action-router.md
      - reference/endpoints.md
  - English:
      - en/index.md
      - en/getting-started.md
      - en/architecture.md
      - en/wizard/index.md
      - en/wizard/step-1-create-form.md
      - en/wizard/step-2-components.md
      - en/wizard/step-3-actions.md
      - en/wizard/step-4-external-services.md
      - en/wizard/step-5-workers-camunda.md
      - en/guides/acl.md
      - en/guides/keycloak-auth.md
      - en/guides/query-field-acl.md
      - en/guides/import-ownership.md
      - en/guides/remote-select.md
      - en/guides/security.md
      - en/demo/index.md
      - en/demo/examples.md
      - en/reference/action-router.md
      - en/reference/endpoints.md