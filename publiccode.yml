description:
  it:
    documentation: 'https://github.com/INRIM/service-app/blob/3.0/README.md'
    features:
      - >-
        Creazione di applicazioni e moduli web tramite il form builder
        Form.io.js;
      - CRUD generico con persistenza dei dati su MongoDB;
      - >-
        Architettura multi-tenant con un backend condiviso e un frontend per
        ogni singolo client;
      - Selezione dell'applicazione tramite APP_CODE;
      - >-
        Autenticazione Keycloak tramite Authorization Code e pattern Backend
        for Frontend (BFF);
      - >-
        Estensione delle applicazioni tramite plugin contenenti form, modelli
        e dati iniziali;
      - Interfaccia basata su Bootstrap Italia 2.18.2;
      - >-
        Servizi companion per invio della posta, pianificazione degli eventi
        di calendario e gestione delle identità;
      - >-
        Predisposizione all'automazione dei processi descritti in BPMN tramite
        Camunda;
      - >-
        Creazione di worker applicativi basati sulla libreria open source
        ozon-env.
    longDescription: >
      **Ozon Service Platform** è una piattaforma RAD per la creazione di
      applicazioni e moduli web destinata alle Pubbliche Amministrazioni e alle
      organizzazioni che devono digitalizzare servizi, raccolte dati e processi.


      Principali caratteristiche:


      - creazione di form tramite Form.io.js, utilizzato direttamente dal
        frontend senza la precedente verticalizzazione Python;

      - operazioni CRUD generiche con persistenza dei dati su MongoDB;

      - architettura multi-tenant, con un backend condiviso che serve più
        applicazioni identificate tramite APP_CODE;

      - un'istanza frontend dedicata per ogni singolo client, collegata al
        backend attraverso una rete Docker condivisa;

      - autenticazione Keycloak tramite Authorization Code e pattern Backend
        for Frontend (BFF), con gestione della sessione tramite cookie;

      - applicazioni estendibili mediante plugin contenenti manifest, form,
        modelli e dati iniziali, individuati e installati dal backend;

      - interfaccia grafica basata su Bootstrap Italia 2.18.2;

      - servizi companion dedicati all'invio della posta, alla pianificazione
        degli eventi di calendario e alla gestione delle identità;

      - predisposizione alla gestione automatizzata dei processi descritti in
        BPMN tramite Camunda;

      - possibilità di creare worker applicativi usando come libreria di base
        ozon-env, disponibile su https://github.com/INRIM/ozon-env;

      - distribuzione tramite immagini Docker pubbliche su GHCR, scaricabili
        senza autenticazione.


      Questo repository contiene i template Docker Compose e i file di
      configurazione necessari per avviare il backend condiviso e le istanze
      frontend dei singoli client.
    screenshots:
