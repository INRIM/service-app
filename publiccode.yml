description:
  it:
    features:
      - Creazione di form con Form.io
      - CRUD generico con persistenza MongoDB
      - Gestione multi-tenant tramite APP_CODE
      - Autenticazione Keycloak con pattern BFF
      - Estensione tramite plugin applicativi
      - Servizi companion per posta, calendario e identità
      - Predisposizione all'automazione di processi BPMN con Camunda
      - Creazione di worker basati sulla libreria ozon-env
    screenshots:
      - gallery/dashboard.png
      - gallery/design.png
      - gallery/enter_data.png
      - gallery/view_edit_data.png
    longDescription: |
      App Builder è una piattaforma RAD per creare applicazioni e moduli web
      tramite Form.io. Offre operazioni CRUD generiche con persistenza MongoDB,
      un'interfaccia basata su Bootstrap Italia e autenticazione Keycloak con
      flusso Authorization Code gestito dal backend secondo il pattern BFF.

      La versione 3.0 adotta un'architettura multi-tenant: un backend condiviso
      serve più applicazioni, identificate tramite APP_CODE, mentre ogni client
      dispone di una propria istanza frontend. Le form, i modelli e i dati
      iniziali di ciascuna applicazione sono distribuiti come plugin esterni,
      scoperti e installati dal backend.

      Lo stack comprende inoltre servizi companion dedicati all'invio della
      posta, alla pianificazione degli eventi di calendario e alla gestione
      delle identità ed è predisposto per la gestione automatizzata dei
      processi descritti in BPMN tramite Camunda. I worker applicativi possono
      essere creati usando come libreria di base ozon-env, disponibile su
      https://github.com/INRIM/ozon-env. Questo repository contiene i template
      Docker Compose e i file di configurazione necessari per avviare il
      backend condiviso e le istanze frontend dei singoli client.
    shortDescription: Piattaforma RAD multi-tenant per creare applicazioni e form web
