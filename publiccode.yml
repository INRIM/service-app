releaseDate: "2026-08-26"
softwareVersion: 3.0.0
developmentStatus: stable
softwareType: standalone/web
platforms:
  - web
  - linux
usedBy:
  - Istituto Nazionale di Ricerca Metrologica
categories:
  - it-development
  - application-development
  - collaboration
  - customer-service-and-support
  - help-desk
  - office
